name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # wdio.conf.mts prints the resolved Obsidian versions; use them as the
      # cache key so new Obsidian releases are downloaded once.
      - name: Get Obsidian cache key
        run: |
          npx tsx wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          rm -rf .obsidian-cache
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Obsidian
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}
      # Obsidian needs a display: run it under Xvfb with a window manager.
      - name: Setup virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &
          sleep 1
      - name: E2E tests
        run: npm run test:e2e
        env:
          # obsidian-launcher uses it for GitHub API calls when resolving
          # Obsidian versions (avoids the anonymous rate limit).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest Obsidian release with an Android build, and the latest one.
        obsidian-version: ["1.5.8/1.5.8", "latest/latest"]
    name: android (${{ matrix.obsidian-version }})
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Get Obsidian cache key
        run: |
          npx tsx wdio.mobile.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          rm -rf .obsidian-cache
        env:
          CI: "true"
          OBSIDIAN_VERSIONS: ${{ matrix.obsidian-version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Obsidian
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-android-${{ hashFiles('obsidian-versions-lock.txt') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-pixel
      - name: Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: obsidian_test
          force-avd-creation: false
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel
          disk-size: 4096M
          heap-size: 512M
          emulator-options: -no-snapshot -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: npm run test:android
        env:
          OBSIDIAN_VERSIONS: ${{ matrix.obsidian-version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
